[package]
name = "bsky-motif"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
# Cross-platform secret storage. Base has no store backend; each target adds its
# own below (macOS Keychain / Linux Secret Service over D-Bus).
keyring = { version = "4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }

# GNOME Keyring / KWallet both provide the freedesktop Secret Service; the
# pure-Rust zbus backend talks to it without linking C libdbus.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4", features = ["zbus-secret-service-keyring-store"] }

[profile.release]
strip = true
